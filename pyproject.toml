[project]
name = "obsidian-tasks-mcp"
version = "0.1.0"
description = "MCP server that manages Kanban-plugin task boards and their task notes in an Obsidian vault through the Local REST API plugin."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "mcp>=2",
    "httpx>=0.27",
]

[project.scripts]
obsidian-tasks-mcp = "obsidian_tasks_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obsidian_tasks_mcp"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
